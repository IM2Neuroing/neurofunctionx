[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "neurofunctionx"
version = "0.1.0"
description = "Reusable helper and DBS-simulation functions for the neuro stack (I/O, image/mesh utilities, COMSOL and e-field helpers)."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Michel Ruchti" }
]
keywords = ["neuro", "medical-imaging", "simpleitk", "dbs", "comsol", "utilities"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=2.3.5",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "SimpleITK>=2.5.3",
    "vtk>=9.6.0",
]

[project.urls]
Repository = "https://github.com/IM2Neuroing/neurofunctionx.git"

[tool.hatch.version]
path = "neurofunctionx/__init__.py"

[tool.hatch.build]
include = [
    "neurofunctionx/**",
    "README.md",
    "LICENSE",
]

[project.optional-dependencies]
tests = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]
